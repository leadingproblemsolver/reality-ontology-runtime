version: 1
name: "Logistinfra Sociotechnical Control Plane"
captured_at: "2026-10-10T09:36:00+03:00"
timezone: "Asia/Qatar"
location_context: "Doha, Qatar"
authority_note: "This file defines routing/policy. Reality Ontology / durable runtime state owns current truth."

objective:
  equation: "maximum verified external consequence / minimum human + engineering time"
  human_goal: "continuously reduce the fraction of work that requires the user while increasing the quality of the fraction that does"
  anti_goal:
    - "do not maximize agent count"
    - "do not maximize token throughput"
    - "do not maximize internal artifact volume"
    - "do not make SF/internet-first assumptions when Doha/local reality changes reachability"
    - "do not build what can be reused, configured, composed, learned, bought, delegated, or operated through an existing surface"

canonical_spine:
  - "INPUT"
  - "STRUCTURALIZE"
  - "SYNC_MINIMUM_REALITY"
  - "FIND_EXISTING_OWNER"
  - "DISCOVER_EXISTING"
  - "HUMAN_TIME_GATE"
  - "PRIORITIZE"
  - "COMPILE_MVEXEC"
  - "EXECUTE_OR_HANDOFF"
  - "FRESH_REREAD"
  - "VERIFY"
  - "RECEIPT"
  - "SETTLE"
  - "EXTERNALIZE"
  - "FEEDBACK"
  - "NEXT"

hard_invariants:
  truth:
    - "Reality Ontology owns canonical truth, evidence, provenance, contradictions, waiting, blockers, receipts, and settlement."
    - "Prepared != authorized != executed != verified."
    - "Tool/model success != outcome success."
    - "External state is never inferred from internal completion."
    - "Unknown, blocked, waiting, falsified, and killed are valid terminal/current states."
  reuse:
    - "REUSE -> CONFIGURE -> COMPOSE -> THIN_GLUE -> CUSTOM."
    - "Custom creation requires explicit evidence that existing surfaces fail the acceptance condition."
    - "A tutorial/video/course can be the correct execution dependency when learning the existing procedure is cheaper than automation."
    - "A human/service can be the correct executor when delegation is cheaper and safe."
  attention:
    - "Waiting external work disappears from active attention until its wake condition fires."
    - "No new chat when an existing operator already owns the responsibility."
    - "No new repo branch when an existing branch/component owns the responsibility unless a durable isolation need is proven."
  execution:
    - "One active transition at a time per bounded mission unless true parallel independence is proven."
    - "Every consequential action requires a verifier and receipt contract before execution."
    - "On ambiguous failure, reread external reality before retry."
  market:
    - "Prepared-but-unsent does not count as market movement."
    - "Internal proof is upgraded only by external judgment/use/payment/merge/referral or an inspectable capability gain/falsified hypothesis."
    - "Every active day should produce at least one qualified external attempt when feasible."

universal_structuralizer:
  trigger: "every new chat, project, task, idea, reply, artifact, blocker, learning goal, admin obligation, or opportunity"
  output_schema:
