daily_navigation:
  start_of_day:
    command: "NAVIGATE TODAY"
    sequence:
      - "SYNC only relevant live sources: Gmail, Calendar, GitHub/CI, CRM/payment/deploy surfaces if active"
      - "load latest durable settlement/resume state"
      - "suppress WAITING_EXTERNAL"
      - "surface hard deadline/actor/production preemptions"
      - "select one P1 transition"
      - "select one same-day P2 external consequence floor"
      - "surface only mandatory P0/P-1 physical/admin/fundamental floors"
    output:
      - "NOW"
      - "INTERRUPTION_LANE"
      - "HUMAN_ONLY"
      - "MACHINE_QUEUE"
      - "EXTERNAL_RECEIPT_FLOOR"
      - "MANDATORY_FLOOR"
  before_every_chat_or_project:
    awareness_prompts:
      - "What durable object/workstream is this?"
      - "What is observed vs inferred vs unknown?"
      - "Who already owns this?"
      - "What existing artifact/tool/repo/API/MCP/SaaS/program/video/human can solve it?"
      - "What should explicitly not be built?"
      - "Does the user uniquely need to act?"
      - "What exact state transition and receipt end this?"
      - "Can this be externalized immediately after verification?"
  before_every_build:
    awareness_prompts:
      - "Search internal repo/branches first."
      - "Search connected tools/connectors."
      - "Search external ecosystem only if still uncertain."
      - "Prefer existing implementation over a new abstraction."
      - "Require a hostile/negative test."
  before_every_human_action:
    awareness_prompts:
      - "Can the system prepare everything except judgment/trust/approval/physical action?"
      - "What exact words, page, number, URL, file, and stop condition should already be open?"
  after_every_action:
    awareness_prompts:
      - "Fresh-reread reality."
      - "What actually changed?"
      - "What remains unproven?"
      - "What receipt is inspectable?"
      - "SETTLE / BLOCK / WATCH / KILL."
      - "What next action can now be pre-staged?"
  end_of_day:
    log_only:
      - "external receipts"
      - "payments/meetings/replies/rejections"
      - "merged/reused/adopted artifacts"
      - "falsified hypotheses"
      - "avoidable human minutes"
      - "repeated friction"
      - "tool/auth failures"
      - "new reusable capability"
      - "wrong routing assumptions"
    do_not_log:
      - "diary narrative"
      - "internal artifact counts without consequence"

priority_stack:
  rule: "dependency-gated; do not finish lower layers before executing"
  order:
    - rank: 1
      layer: "P1_EXECUTION"
      question: "What real state can change now?"
    - rank: 2
      layer: "P2_GTM"
      question: "How does verified utility meet a real receiver now?"
    - rank: 3
      layer: "P-1_REALITY_TRACKING"
      question: "What is true and what receipt settles it?"
    - rank: 4
      layer: "P0_SETUP_ADMIN"
      question: "What setup/admin must be compressed so P1/P2 can happen?"
    - rank: 5
      layer: "P-2_FOUNDATION_INFRA"
      question: "What exact infra seam blocks P1/P2?"
    - rank: 6
      layer: "P3_LEVERAGE_SCALING"
      question: "Which externally proven primitive deserves multiplication?"
  p3_entry_gate:
    - "repeatable verified P1 execution"
    - "at least one meaningful external P2 use/adoption/payment/merge/referral signal"

money_and_leads:
  daily_floor: "one qualified external consequence attempt before discretionary internal work expands"
  state_machine:
    - "IDENTIFIED"
    - "QUALIFIED"
    - "CONTACT_READY"
    - "CONTACTED"
    - "ENGAGED"
    - "PROBLEM_CONFIRMED"
    - "SOLUTION_SCOPED"
    - "COMMITMENT"
    - "PAID_OR_PILOT"
    - "DELIVERY"
    - "VALUE_OBSERVED"
    - "EXPANSION_OR_REFERRAL"
  routing:
    warm_named_human: "Direct Human Gap Router"
    company_problem: "Serious Company / Market Router"
    active_partner_calling: "Bridge/Matthew sales lane"
    job_or_internship: "Profile/Application"
    open_source_technical: "Creator/Maintainer"
  invariant: "CONTACT_READY is not progress when SEND/CALL is admissible."

learning:
  purpose: "upgrade judgment or unlock an immediate transition"
  route:
    - "official docs/examples"
    - "best existing repo implementation"
    - "targeted YouTube/video/tutorial"
    - "course only when repeated capability gap justifies it"
    - "expert/human conversation"
  acceptance: "learning ends in a bounded test, changed decision quality, or reusable operating procedure"
  kill: "passive accumulation without application"

metrics:
  primary:
    verified_external_consequences_per_week:
      direction: "up"
      examples: ["reply","meeting","payment","use","merge","referral","accepted submission","credible rejection"]
    median_human_minutes_per_settled_transition:
      direction: "down"
    median_time_input_to_mvec:
      target: "<=5 minutes"
    context_reconstruction_human_minutes:
      target: "approach zero"
    waiting_work_resurfaced_without_wake:
      target: 0
    build_before_reuse_violations:
      target: 0
    tool_success_without_independent_verification_settled:
      target: 0
  leverage:
    reuse_ratio:
      formula: "transitions solved by reuse/configure/compose/delegate/learn / all solved transitions"
      direction: "toward 1.0"
    human_keep_ratio:
      formula: "human tasks requiring irreducible judgment/trust/access/physical action / all human tasks"
      direction: "toward 1.0"
    prepared_to_externalized_ratio:
      formula: "externally sent/submitted/used artifacts / contact-ready or externalization-ready artifacts"
      direction: "up"
    machine_prepared_human_actions:
      formula: "human actions where exact surface/context/script/stop condition were pre-staged / human actions"
      direction: "toward 1.0"
    maintenance_tax:
      formula: "recurring human minutes maintaining automation / human minutes saved"
      kill_rule: "kill or simplify when tax persistently erases the benefit"
  market:
    qualified_external_actions_per_day:
      floor: 1
    contact_to_response:
      direction: "measure, then improve"
    response_to_problem_confirmed:
      direction: "measure, then improve"
    problem_confirmed_to_commitment:
      direction: "measure, then improve"
    commitment_to_paid_or_pilot:
      direction: "measure, then improve"

commands:
  - "NAVIGATE TODAY"
  - "NOW"
  - "CONTINUE <workstream>"
  - "STRUCTURALIZE <input>"
  - "DISCOVER_EXISTING <capability>"
  - "PREP <transition>"
  - "EXECUTE"
  - "WATCH"
  - "SETTLE"
  - "EXTERNALIZE <artifact>"
  - "REVIEW HUMAN TIME"
  - "END DAY"

default_output:
  - "REALITY"
  - "OWNER"
  - "DISPOSITION"
  - "EXISTING LEVERAGE"
  - "HUMAN_ONLY"
  - "MVEXEC"
  - "VERIFY"
  - "RECEIPT"
  - "EXTERNALIZE"
  - "NEXT"

stop_conditions:
  - "Do not create another router."
  - "Do not create another memory/graph/vector layer without a measured retrieval failure."
  - "Do not create another next-action engine; reuse NextMove/P-1."
  - "Do not create another model-worker router; reuse runtime-v1 capability resolution."
  - "Do not create another sales system; route through Market Router / Direct Human Gap Router / current partner pipeline."
  - "Do not manually maintain state observable from Gmail/Calendar/GitHub/CRM/CI/payment/deployment sources."
  - "Do not keep a chat alive merely because it contains useful history; extract durable state/artifacts and route future work to its owner."
