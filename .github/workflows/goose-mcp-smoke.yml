name: goose-mcp-external-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - actualize/reality-ontology-runtime-v0
    paths:
      - .github/workflows/goose-mcp-smoke.yml
      - examples/goose_github_mcp_smoke.yaml
      - scripts/github_smoke_mcp.py
      - scripts/mock_openai_tool_server.py
      - scripts/run_goose_mcp_smoke.py
      - scripts/verify_github_issue.py
      - scripts/close_github_smoke_issue.py
      - src/reality_ontology/operators/goose_headless.py

permissions:
  contents: read
  issues: write

jobs:
  real-goose-mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOSE_PROVIDER: openai
      GOOSE_MODEL: gpt-4o
      GOOSE_MODE: auto
      GOOSE_DISABLE_SESSION_NAMING: "true"
      OPENAI_BASE_URL: http://127.0.0.1:8765/v1
      OPENAI_API_KEY: local-smoke-no-secret
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reality runtime and MCP SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'mcp>=2.0'

      - name: Install real Goose CLI
        env:
          CONFIGURE: "false"
          GOOSE_BIN_DIR: ${{ runner.temp }}/goose-bin
        run: |
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash
          echo "${GOOSE_BIN_DIR}" >> "$GITHUB_PATH"
          "${GOOSE_BIN_DIR}/goose" --version

      - name: Start deterministic OpenAI-compatible driver
        run: |
          python scripts/mock_openai_tool_server.py > "${RUNNER_TEMP}/mock-openai.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mock-openai.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/mock-openai.log"
          exit 1

      - name: Normal path — Goose -> MCP -> GitHub -> reread -> settle -> restart
        env:
          REALITY_SMOKE_MARKER: reality-goose-mcp-${{ github.run_id }}-${{ github.run_attempt }}-normal
          REALITY_SMOKE_RECEIPT: .runtime/reality-goose-mcp-normal.json
          REALITY_SMOKE_STALL_AFTER_WRITE_SECONDS: "0"
          REALITY_GOOSE_TIMEOUT_SECONDS: "180"
          REALITY_EXPECT_GOOSE_TIMEOUT: "false"
        run: python scripts/run_goose_mcp_smoke.py

      - name: Close normal reversible probe issue
        if: always()
        env:
          REALITY_SMOKE_RECEIPT: .runtime/reality-goose-mcp-normal.json
        run: python scripts/close_github_smoke_issue.py --receipt "${REALITY_SMOKE_RECEIPT}"

      - name: Ambiguous path — external effect occurs then Goose times out
        if: always()
        env:
          REALITY_SMOKE_MARKER: reality-goose-mcp-${{ github.run_id }}-${{ github.run_attempt }}-ambiguous
          REALITY_SMOKE_RECEIPT: .runtime/reality-goose-mcp-ambiguous.json
          REALITY_SMOKE_STALL_AFTER_WRITE_SECONDS: "30"
          REALITY_GOOSE_TIMEOUT_SECONDS: "8"
          REALITY_EXPECT_GOOSE_TIMEOUT: "true"
        run: python scripts/run_goose_mcp_smoke.py

      - name: Close ambiguous reversible probe issue
        if: always()
        env:
          REALITY_SMOKE_RECEIPT: .runtime/reality-goose-mcp-ambiguous.json
        run: python scripts/close_github_smoke_issue.py --receipt "${REALITY_SMOKE_RECEIPT}"

      - name: Show non-secret proof receipts
        if: always()
        run: |
          for receipt in .runtime/reality-goose-mcp-*.json; do
            test -f "$receipt" && cat "$receipt" || true
          done
          test -f "${RUNNER_TEMP}/mock-openai.log" && tail -100 "${RUNNER_TEMP}/mock-openai.log" || true

      - name: Upload settlement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goose-mcp-settlement-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .runtime/goose-mcp-smoke-*.db
            .runtime/reality-goose-mcp-*.json
            ${{ runner.temp }}/mock-openai.log
