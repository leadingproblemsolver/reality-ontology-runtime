      unit_id: null
      type: "task|project|problem|opportunity|recurring_process|decision|learning"
      source_chat: null
      workstream: null
      owner: null
    target:
      objective: null
      desired_state: null
      success_metric: null
      cost_of_delay: null
      time_horizon: null
    reality:
      observed: []
      inferred: []
      unknown: []
      contradictions: []
      dependencies: []
      blockers: []
      waiting_external: []
      authority_boundary: null
    existing_leverage:
      internal_component: []
      current_repo_or_branch: []
      artifact_or_prompt: []
      connector_or_plugin: []
      api_or_mcp: []
      cli_or_script: []
      saas_or_program: []
      open_source_repo: []
      marketplace_or_template: []
      documentation: []
      youtube_or_video: []
      course_or_tutorial: []
      specialist_service_or_human: []
      local_doha_surface: []
    decision:
      disposition: "KILL|WATCH|REUSE|CONFIGURE|COMPOSE|DELEGATE|LEARN|THIN_GLUE|CUSTOM"
      selected_route: null
      explicit_non_build_reason: null
    mvexec:
      exact_action: null
      surface: null
      executor: null
      context_refs: []
      first_action: null
      done_when: null
      verify_with: null
      receipt: null
      fallback: null
      stop_after_minutes: 10
    externalization:
      candidate: false
      surface: null
      receiver: null
      exact_action: null
      receipt: null
    feedback:
      expected: null
      observed: null
      human_minutes: 0
      machine_minutes: 0
      setup_minutes: 0
      maintenance_minutes_added: 0
      reuse_created: null
      capability_created: null
      access_created: null
      proof_created: null
      wrong_assumption: null
      next_policy_candidate: null

discover_existing:
  mandatory_before_custom_work: true
  search_order:
    - "existing Logistinfra component / Reality Ontology / NextMove / P-1 / Market Router / operator chat"
    - "existing repository branch, script, fixture, package, or proof artifact"
    - "connected ChatGPT plugin/connector or direct provider connector"
    - "official API / MCP / CLI / SDK"
    - "existing SaaS or automation platform"
    - "open-source repository / package registry"
    - "marketplace / template / Actor / node / integration"
    - "official documentation / examples"
    - "YouTube/video/tutorial/course that directly teaches the operational procedure"
    - "specialist service / contractor / local human operator"
    - "compose existing pieces"
    - "thin glue"
    - "custom implementation"
  acceptance_questions:
    - "Does an existing surface satisfy the exact done_when?"
    - "Can it be verified independently?"
    - "Does it preserve authority and data boundaries?"
    - "What human minutes and recurring maintenance does it remove?"
    - "What is the fastest path to a real receipt?"
  gemini_role:
    use_when: "ecosystem/tool/repo/program search is materially uncertain"
    instruction: "map existing systems first; do not design new architecture"
  claude_or_code_worker_role:
    use_when: "bounded implementation/repo reconstruction is still required after reuse scan"
    instruction: "thin glue only; no authority over routing/canonical truth"
  video_learning_rule:
    use_when: "a procedural capability can be learned and executed faster than automating it"
    output: "exact video/resource + timestamp/section + one bounded practice/action + receipt"
    anti_pattern: "passive content consumption without an execution transition"

human_time_gate:
  default: "do not allocate to the user"
  keep_human_only_when:
    - "strategic goal/portfolio choice"
    - "reality arbitration across conflicting technical, market, social, institutional, financial, local, and personal constraints"
    - "taste, positioning, messaging, brand, or quality judgment"
    - "human relationship, call, meeting, rapport, negotiation, trust, introduction, or high-context selling"
    - "credentials/access that cannot safely be delegated"
    - "irreversible or reputationally consequential approval"
    - "physical-world action"
    - "learning that materially upgrades judgment/capability"
    - "personal physical/mental operating capacity"
  machine_first:
    - "research collection"
    - "retrieval"
    - "comparison"
    - "data extraction"
    - "drafting"
    - "coding/glue"
    - "testing"
    - "status checking"
    - "CRM/log updates"
    - "scheduling/pre-staging"
    - "follow-up preparation"
    - "monitoring"
    - "content repurposing"
    - "reporting"
    - "routine analysis"
  disposition_gate: "KILL -> AUTOMATE -> DELEGATE -> BATCH -> FLOOR -> KEEP"

locality_gate:
  location: "Doha, Qatar"
  questions:
    - "Does local institutional access change the shortest path?"
    - "Can UDST/QSTP/QDB/QEERI/local SMEs/local events/expat or business networks create warmer access than global cold outreach?"
    - "Is the supposedly optimal global route actually reachable from Doha now?"
    - "Can local physical presence create trust/access that remote builders lack?"
    - "Is a local regulatory/institutional constraint a real blocker?"
  rule: "global internet routes and Doha-local routes compete on expected consequence, access, feedback latency, and proof—not prestige."

canonical_operators:
  infra_navigator:
    role: "single front door"
    invoke: "anything new or ambiguous"
    owns:
      - "structuralization"
      - "owner lookup"
      - "reuse scan"
      - "MVExec compilation"
      - "routing"
      - "externalization check"
      - "feedback handoff"
    does_not_own: "canonical truth"
  reality_ontology:
    role: "truth/provenance/receipts/settlement"
    branch_evidence:
      - "feat/logistinfra-mve"
      - "feat/logistinfra-runtime-v1"
  nextmove_pminus1:
    role: "fresh-process restart-safe current mission + one bounded execution block"
    strongest_current_surface: "feat/logistinfra-mve: src/reality_ontology/pminus1.py + nextmove.py"
    proven:
      - "fresh-process resume"
      - "bounded 10/25 minute block compilation"
      - "receipt-required settlement"
      - "expired mission forces settlement"
    policy: "reuse this; do not rebuild another daily next-action engine"
  runtime_v1:
    role: "provider-independent worker/executor kernel"
    branch: "feat/logistinfra-runtime-v1"
    owns:
      - "runAutonomousCycle / runUntilBoundary"
      - "ToolAdapter contract"
      - "capability resolver"
      - "provider-neutral model worker"
      - "worker factory"
      - "verify-before-settle semantics"
    missing:
      - "full standalone external surface independence"
      - "generic runtime entrypoint across all surfaces"
  capability_router_branch:
    branch: "feat/logistinfra-capability-router-v1"
    state: "diverged precursor/adjacent branch"
    policy: "do not add new work here until a diff proves unique functionality not already absorbed by runtime-v1"
  nextmove_branch:
    branch: "feature/logistinfra-nextmove"
    state: "diverged precursor"
    policy: "feat/logistinfra-mve already contains nextmove.py plus P-1/fresh-process work; treat standalone nextmove branch as source history unless unique commits are intentionally reconciled"
  market_router:
    role: "market-facing/economic priority"
    owns:
      - "live signals"
      - "named buyers/operators"
      - "existing artifact-to-pain matching"
      - "external consequence prioritization"
  direct_human_gap_router:
    role: "named human/localized operator intervention"
    owns:
      - "calls"
      - "WhatsApp/direct contact"
      - "specific operator follow-up"
      - "meeting progression"
  serious_company:
    role: "company intervention / paid test"
  creator_maintainer:
    role: "OSS/upstream technical externalization"
    current_proof: "n8n batch produced public artifacts, hostile tests, green CI, public technical communication; external acceptance/merge/commercial consequence still pending"
  proof_closure_router:
    role: "close missing proof with hostile test/receipt; kill or block weak claims"
  profile_application:
    role: "jobs/internships/gigs/application proof"
  calendar_admin_floor:
    role: "deadlines/compliance/appointments/admin compressed to reliable floor"
  fundamentals_router:
    role: "sleep, food, hygiene, physical training, personal operating capacity"

