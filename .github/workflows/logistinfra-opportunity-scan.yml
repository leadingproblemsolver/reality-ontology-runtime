name: Logistinfra Opportunity Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: read

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistinfra-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: logistinfra-runtime/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Scan browser-use issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.LOGISTINFRA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOGISTINFRA_SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LOGISTINFRA_LLM_API_KEY }}
        run: npm run scan
