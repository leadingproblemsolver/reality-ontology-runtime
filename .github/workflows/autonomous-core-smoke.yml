name: Autonomous Core Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'logistinfra-runtime/src/autonomy/**'
      - 'logistinfra-runtime/src/continuity/**'
      - 'logistinfra-runtime/tests/autonomy.test.ts'
      - 'logistinfra-runtime/package.json'
      - 'logistinfra-runtime/package-lock.json'
      - '.github/workflows/autonomous-core-smoke.yml'

jobs:
  autonomous-loop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistinfra-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: logistinfra-runtime/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run build
      - name: Run autonomous-kernel tests
        run: npx vitest run tests/autonomy.test.ts
