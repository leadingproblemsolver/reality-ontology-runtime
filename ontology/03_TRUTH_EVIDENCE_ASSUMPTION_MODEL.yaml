version: "2026-08-25"

truth_state_ladder: [DISCUSSED, DECIDED, PREPARED, IMPLEMENTED, TESTED, DEPLOYED, EXPOSED, EXTERNALLY_USED, REUSED, ADOPTED, PAID, OUTCOME_PRODUCING]
rule: "Each item is a distinct observable transition. Never collapse the ladder into COMPLETE."

epistemic_types: [FACT, USER_REPORTED_FACT, OBSERVATION, DECISION, HYPOTHESIS, INFERENCE, SPECULATION, UNKNOWN]
claim_boundary:
  proven: "Directly supported by evidence sufficient for the stated scope."
  observed: "Seen/measured but not necessarily causally established."
  inferred: "Reasonable interpretation from observations; explicitly non-factual."
  unproven: "Not yet externally or operationally established."
  invariant: "claim_strength <= evidence_strength"

assumption_model:
  rule: "Every consequential decision exposes required assumptions."
  statuses: [active, confirmed, invalidated, superseded, risk_accepted, unmeasured]
  append_only: true
  delete_assumption: false

reality_signal_model:
  types: [execution_outcome, user_feedback, advisor_feedback, metric, failure, market_signal, technical_signal]
  severity: {neutral: 0.00, weak_support: 0.20, strong_support: 0.60, weak_contradiction: -0.30, strong_contradiction: -0.70, invalidating: -1.00}

contradiction_model:
  required_pair: [assumption_id, signal_id]
  propagation: "Critical dependent decisions are re-evaluated when assumption validity falls below threshold."
  preserve_conflict: true
  smoothing_forbidden: true

decision_outcome_model:
  fields: [decision_id, predicted_outcome, predicted_metric, actual_outcome, actual_metric, measurement_window, measured_at, outcome_fidelity]
  fidelity_formula: "(actual_metric - predicted_metric) / max(abs(actual_metric), abs(predicted_metric), 1)"
  interpretation: {accurate: ">= -0.15", degraded: "-0.15 to -0.50", failed: "< -0.50", opposite: "prediction direction contradicted by actual"}

context_validity_rules:
  - "No decision without extracted assumptions."
  - "No assumption without status."
  - "No invalidated decision in active context unless history is requested."
  - "No generated artifact promoted to source truth without acceptance and claim verification."
  - "No duplicate evidence counted as independent support."
  - "No graph edge without source-backed relationship."
  - "Unsupported claim blocks promotion."
  - "Stale or invalidated duplicates are excluded from the final active packet."
