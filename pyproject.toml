[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-ontology-runtime"
version = "0.1.0"
description = "Event-sourced, evidence-bounded runtime for reconstructing, executing, verifying, and settling reality state transitions."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
ro = "reality_ontology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
