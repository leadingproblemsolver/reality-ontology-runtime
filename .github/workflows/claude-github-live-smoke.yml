name: Claude GitHub live read acceptance
on:
  push:
    branches:
      - feat/claude-local-activation-v1
    paths:
      - src/reality_ontology/github_ingest.py
      - scripts/claude_session_activate.py
      - tests/test_github_ingest.py
      - .github/workflows/claude-github-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  live-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Python runtime
        run: python -m pip install -e .
      - name: Live PR read and fresh-process replay
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          import tempfile
          from pathlib import Path
          from reality_ontology.github_ingest import sync_github_pr
          from reality_ontology.store import RealityStore

          repo = "leadingproblemsolver/reality-ontology-runtime"
          db_path = Path(os.environ["RUNNER_TEMP"]) / "claude-cutover-acceptance.db"
          first = sync_github_pr(db_path, repo, 17)
          replay = sync_github_pr(db_path, repo, 17)
          with RealityStore(db_path) as store:
              events = store.db.execute(
                  "SELECT COUNT(*) FROM events WHERE event_id=?", (first["event_id"],)
              ).fetchone()[0]
              evidence = store.db.execute(
                  "SELECT COUNT(*) FROM evidence WHERE evidence_id=?", (first["evidence_id"],)
              ).fetchone()[0]
              settlements = store.db.execute("SELECT COUNT(*) FROM settlements").fetchone()[0]
              state = store.current_state(first["canonical_object_id"])
          assert first["status"] == "NEW_OBSERVATION", first
          assert replay["status"] == "UNCHANGED", replay
          assert events == evidence == 1, (events, evidence)
          assert settlements == 0 and state is None, (settlements, state)
          receipt = {
              "status": "PASS",
              "test": "live_api_to_canonical_ledger_replay_and_fresh_process",
              "source_url": first["source_url"],
              "source_updated_at": first["source_updated_at"],
              "snapshot_sha256": first["snapshot_sha256"],
              "event_id": first["event_id"],
              "evidence_id": first["evidence_id"],
              "events_for_snapshot": events,
              "settlements": settlements,
              "truth_promotion": False,
              "claim_ceiling": "EXTERNAL_SOURCE_OBSERVED_ONLY",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "claude-github-live-receipt.json"
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2), encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: claude-github-live-acceptance
          path: ${{ runner.temp }}/claude-github-live-receipt.json
          retention-days: 14
